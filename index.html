<!doctype html>
<html lang="en" data-theme="auto" data-textsize="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <title>Before the Throne</title>
  <meta name="description" content="A prayer companion for Reformed Presbyterians. It leads you through prayer by the pattern Christ gave and keeps a record of how the Lord has answered.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f6f1e6" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e131b" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Prayer">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
  <script src="./js/theme-init.js"></script>
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/views/today.css">
  <link rel="stylesheet" href="./css/views/pray.css">
  <link rel="stylesheet" href="./css/views/requests.css">
  <link rel="stylesheet" href="./css/views/ebenezer.css">
  <link rel="stylesheet" href="./css/views/journal.css">
  <link rel="stylesheet" href="./css/views/learn.css">
  <link rel="stylesheet" href="./css/views/settings.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-skip>Skip to content</a>

  <header class="app-header">
    <a class="app-title" href="#/today">
      <img class="app-mark" src="./icons/icon.svg" alt="" width="26" height="26">
      <span>Before the Throne</span>
    </a>
    <div class="header-actions">
      <a class="icon-btn" href="#/settings" aria-label="Settings" data-nav="settings"><span data-icon="settings"></span></a>
    </div>
  </header>

  <main id="main" class="app-main" tabindex="-1">
    <noscript>
      <div class="card">
        <h1 class="page-title">Before the Throne</h1>
        <p>This prayer app needs JavaScript turned on to work.</p>
      </div>
    </noscript>
  </main>

  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-inner">
      <a class="tab" href="#/today" data-nav="today"><span data-icon="today"></span><span>Today</span></a>
      <a class="tab" href="#/requests" data-nav="requests"><span data-icon="requests"></span><span>Requests</span></a>
      <a class="tab" href="#/ebenezer" data-nav="ebenezer"><span data-icon="ebenezer"></span><span>Ebenezer</span></a>
      <a class="tab" href="#/journal" data-nav="journal"><span data-icon="journal"></span><span>Journal</span></a>
      <a class="tab" href="#/learn" data-nav="learn"><span data-icon="learn"></span><span>Learn</span></a>
    </div>
  </nav>

  <div class="toast-region" role="status" aria-live="polite"></div>
</body>
</html>
